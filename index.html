<style>
  :root { --bg: #dde3e4; --mark: #d0d8da; --ink: #13212a; --muted: #465760; }
  @media (prefers-color-scheme: dark) {

    min-height: 100vh; min-height: 100svh;

    padding: clamp(1.5rem, 5vw, 4.5rem);

    font: 1.125rem/1.5 "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
  }
  /* Tone-on-tone monogram: present, but quiet. */
  .mark {
    position: fixed; top: 0; right: 0;
    width: min(100vw, 100vh); fill: var(--mark);
  }
  main, footer { position: relative; }
  h1 {
    font-size: clamp(2.25rem, 7vw, 5.5rem); font-weight: 600;
    line-height: 1.02; letter-spacing: -0.025em; text-wrap: balance;
    max-width: 12ch;
  }
  main p { margin-top: 1.5rem; font-size: clamp(1.125rem, 1.6vw, 1.375rem); }
  main p + p { margin-top: 0; color: var(--muted); }
  footer { margin-top: clamp(3rem, 10vh, 7rem); font-size: .875rem; color: var(--muted); }
